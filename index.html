.fr{aspect-ratio:3/4;border-radius:5px;position:relative;overflow:hidden}
.fr span{position:absolute;bottom:3px;inset-inline-start:5px;font-size:.62rem;color:#fff;font-weight:700;letter-spacing:.08em;direction:ltr}

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let saved=null;try{saved=localStorage.getItem('mai_lang')}catch(e){}
let lang=saved||((navigator.language||'').toLowerCase().startsWith('ar')?'ar':'en');
const tx=()=>T[lang], L=o=>o[lang];
function ph(h,r){
  const w=600,hh=Math.round(w/r),m=Math.min(w,hh);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${hh}"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h},95%,68%)"/><stop offset="1" stop-color="hsl(${(h+45)%360},90%,55%)"/></linearGradient></defs><rect width="${w}" height="${hh}" fill="url(#g)"/><circle cx="${w*.8}" cy="${hh*.2}" r="${m*.1}" fill="#fff" fill-opacity=".35"/><g transform="translate(${w/2} ${hh/2})" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="4"><circle r="${m*.17}"/><circle r="${m*.07}"/>${[0,60,120,180,240,300].map(a=>`<line x1="0" y1="${-m*.07}" x2="0" y2="${-m*.17}" transform="rotate(${a})"/>`).join('')}</g></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
PHOTOS.forEach(p=>p.img=p.src||ph(p.h,p.r));
$('#sheet').innerHTML=[0,1,2,3,4,5,6,7,9].map((i,k)=>`<div class="fr${k===4?' sel':''}" style="background:url('${PHOTOS[i].img}') center/cover"><span>${String(k+1).padStart(2,'0')}</span></div>`).join('');
$('#aboutPh').style.background=`url('${ph(335,.8)}') center/cover`;
let cat='all',shown=[],selSvc=0,selTime=0;
function gal(){
  const cs=['all',...new Set(PHOTOS.map(p=>p.c))];
  $('#filters').innerHTML=cs.map(c=>`<button class="fl" data-c="${c}" aria-pressed="${c===cat}">${esc(c==='all'?tx().all:tx().cats[c])}</button>`).join('');
  shown=PHOTOS.filter(p=>cat==='all'||p.c===cat);
  $('#mason').innerHTML=shown.map((p,i)=>`<button class="ph" data-i="${i}" aria-label="${esc(L(p.t))}"><img src="${esc(p.img)}" alt="${esc(L(p.t))}" loading="lazy"><span class="cap">${esc(L(p.t))} <small>· ${esc(tx().cats[p.c])}</small></span></button>`).join('');
}
function svc(){
  $('#sl').innerHTML=SERVICES.map((s,i)=>`<article class="s" style="--c:${COLORS[i%COLORS.length]}"><h3>${esc(L(s.n))}</h3><p>${esc(L(s.d))}</p><div class="meta"><span>${esc(L(s.u))}</span><span>${esc(L(s.m))}</span></div><div class="row"><div class="pr">${CFG.CURRENCY}${s.p.toLocaleString('en-US')}<small>${tx().from}</small></div><button class="bt" data-b="${i}">${tx().bookThis}</button></div></article>`).join('');
  $('#sv').innerHTML=SERVICES.map((s,i)=>`<option ${i===selSvc?'selected':''}>${esc(L(s.n))}</option>`).join('');
  $('#tm').innerHTML=tx().times.map((s,i)=>`<option ${i===selTime?'selected':''}>${esc(s)}</option>`).join('');
}
function setLang(l){
  lang=l;try{localStorage.setItem('mai_lang',l)}catch(e){}
  const d=document.documentElement;d.lang=l;d.dir=l==='ar'?'rtl':'ltr';document.title=tx().title;
  $$('[data-i]').forEach(e=>{e.innerHTML=tx()[e.dataset.i]});
  $$('[data-ip]').forEach(e=>e.placeholder=tx()[e.dataset.ip]);
  $('#lang').textContent=tx().langBtn;
  $('#logo').innerHTML=l==='ar'?'مي<i></i>فوتوغرافي':'Mai<i></i>Photography';
  $('#steps').innerHTML=tx().steps.map(s=>`<div class="st"><b>${esc(s[0])}</b><p>${esc(s[1])}</p></div>`).join('');
  $('#faqs').innerHTML=tx().faq.map(f=>`<details><summary>${esc(f[0])}</summary><p>${esc(f[1])}</p></details>`).join('');
  $('#aboutPh').setAttribute('aria-label',l==='ar'?'صورة مي (مؤقتة)':'Portrait of Mai (placeholder)');
  gal();svc();
  if(CFG.INSTAGRAM){const a=$('#igl');a.href=CFG.INSTAGRAM;a.style.display='inline'}
}
$('#lang').onclick=()=>setLang(lang==='ar'?'en':'ar');
$('#sv').onchange=e=>selSvc=e.target.selectedIndex;$('#tm').onchange=e=>selTime=e.target.selectedIndex;
$('#filters').onclick=e=>{const b=e.target.closest('[data-c]');if(b){cat=b.dataset.c;gal()}};
$('#sl').onclick=e=>{const b=e.target.closest('[data-b]');if(!b)return;selSvc=+b.dataset.b;$('#sv').selectedIndex=selSvc;$('#book').scrollIntoView({behavior:'smooth'})};
/* lightbox */
let li=0;const lb=$('#lb');
function show(i){li=(i+shown.length)%shown.length;const p=shown[li];$('#li').src=p.img;$('#li').alt=L(p.t);$('#lc2').textContent=L(p.t)+' · '+tx().cats[p.c];lb.classList.add('open')}
$('#mason').onclick=e=>{const b=e.target.closest('[data-i]');if(b)show(+b.dataset.i)};
$('#lx').onclick=()=>lb.classList.remove('open');$('#lp').onclick=()=>show(li-1);$('#ln').onclick=()=>show(li+1);
lb.onclick=e=>{if(e.target===lb)lb.classList.remove('open')};
document.onkeydown=e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')lb.classList.remove('open');if(e.key==='ArrowRight')show(li+1);if(e.key==='ArrowLeft')show(li-1)};
/* booking */
const now=new Date();now.setMinutes(now.getMinutes()-now.getTimezoneOffset());$('#dt').min=now.toISOString().slice(0,10);$('#yr').textContent=new Date().getFullYear();
$('#bf').onsubmit=e=>{
  e.preventDefault();
  const n=$('#nm').value.trim(),p=$('#ph').value.trim(),er=$('#er');
  if(!n||!/^[0-9+\s-]{9,15}$/.test(p)||!$('#dt').value){er.style.display='block';er.textContent=tx().err;return}
  er.style.display='none';
  const d=new Date(),no=CFG.PREFIX+'-'+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+Math.floor(1000+Math.random()*9000);
  const s=SERVICES[selSvc],w=tx().wa;
  const t=`${w.title}\n${w.ref}: ${no}\n\n${w.name}: ${n}\n${w.phone}: ${p}\n${w.svc}: ${L(s.n)} (${w.from} ${CFG.CURRENCY}${s.p})\n${w.date}: ${$('#dt').value}\n${w.time}: ${tx().times[selTime]}\n${w.loc}: ${$('#lc').value.trim()||w.ns}${$('#nt').value.trim()?`\n${w.note}: ${$('#nt').value.trim()}`:''}`;
  const url='https://wa.me/'+CFG.WHATSAPP+'?text='+encodeURIComponent(t);
  try{const A=JSON.parse(localStorage.getItem('mai_requests')||'[]');A.unshift({no,n,p,service:s.n.en,date:$('#dt').value,at:d.toISOString()});localStorage.setItem('mai_requests',JSON.stringify(A))}catch(x){}
  $('#no').textContent=no;$('#wl').href=url;$('#ok').style.display='block';window.open(url,'_blank');
};
setLang(lang);
</script>
